services:
  game:
    build:
      context: ..
      args:
        VITE_CHAIN_ID: ${CHAIN_ID:-46630}
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
        VITE_TESTNET_RPC_URL: ${VITE_TESTNET_RPC_URL:-}
        VITE_MAINNET_RPC_URL: ${VITE_MAINNET_RPC_URL:-}
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/outpost.sqlite
    volumes:
      - game-data:/app/data
    ports:
      - '127.0.0.1:3000:3000'
    init: true
    stop_grace_period: 30s
volumes:
  game-data:
